openapi: 3.0.3
info:
  title: WQC Orchestrator Client HTTP API
  version: 0.1.0
  description: |
    Public HTTP JSON API served on port **9000**. This file is the source of
    truth for client-facing request and response shapes.

    Workers talk to the swarm over **libp2p**, not these routes, except
    `GET /api/v1/p2p/bootstrap`. There is no result webhook.

    **Out of scope here:** libp2p message schemas, the p2p-proxy UDS control
    plane, `/health`, and `/metrics`. Protocol meaning (fees, STARK, task
    lifecycle) lives in
    [wqc-docs](https://github.com/world-qc/wqc-docs).

    Circuit payload **meaning** — gate grammar, measurement rules, output
    modes, determinism, scale limits — is normative in
    [wqc-docs `spec/circuit-payload.md`](https://github.com/world-qc/wqc-docs/blob/main/spec/circuit-payload.md).
    This file defines the structural contract only.

    Some validation failures use `text/plain` (`net/http` `Error`); domain
    errors on submit/get-task use JSON `{"error": "..."}`.
  license:
    name: GPL-3.0
    url: https://www.gnu.org/licenses/gpl-3.0.html

servers:
  - url: http://localhost:9000
    description: Default local bind (`:9000`)

tags:
  - name: Tasks
    description: Submit jobs and poll status / manifests
  - name: Bootstrap
    description: Node discovery of libp2p dial targets
  - name: Economy
    description: Off-chain Redis ledger quotes and balances
  - name: Payout
    description: Operator EVM payout registry (E5a)
  - name: Settlement
    description: On-chain lockEscrow / settle / finalize (E5a)

paths:
  /api/v1/submit:
    post:
      tags: [Tasks]
      summary: Submit a quantum computation task
      description: |
        Assigns a UUID v7 `task_id`, queues compact-register slicing, and
        returns `202 Accepted` with `status: accepted`. Task meta starts as
        `pending`; poll `GET /api/v1/task/{task_id}` until `completed` or
        `failed`.

        When `WQC_CLIENT_BILLING` is enabled (default **true**), `client_id`
        is required and Redis escrow is locked from that client's balance.

        `sample_seed` is **generated by the orchestrator** for
        `sample_counts` and must not be supplied by the client.

        Optional submit-time on-chain lock: send `client_address` + EIP-2612
        `permit` (`spender` = settlement contract, `value` = escrow). The
        relayer calls `lockEscrowWithPermit`. On failure Redis escrow is
        released and the request errors. Response may include
        `lock_escrow_tx_hash`.
      operationId: submitTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitRequest"
            examples:
              scalar:
                summary: Scalar amplitude (default)
                value:
                  qubit_count: 3
                  client_id: "alice"
                  circuit:
                    - type: H
                      params: [0]
                    - type: CCNOT
                      params: [0, 1, 2]
                  security_level: low
              sample_counts:
                summary: Measurement histogram
                value:
                  qubit_count: 2
                  classical_bit_count: 2
                  output_mode: sample_counts
                  shots: 1024
                  security_level: low
                  client_id: "alice"
                  circuit:
                    - type: H
                      params: [0]
                    - type: CNOT
                      params: [0, 1]
                    - type: MEASURE
                      params: { qubit: 0, cbit: 0 }
                    - type: MEASURE
                      params: { qubit: 1, cbit: 1 }
              expectation:
                summary: Pauli expectation
                value:
                  qubit_count: 2
                  output_mode: expectation
                  security_level: low
                  client_id: "alice"
                  circuit:
                    - type: H
                      params: [0]
                    - type: CNOT
                      params: [0, 1]
                  observables:
                    - id: ZZ
                      terms:
                        - label: ZZ
                          coeff: { real: 1.0, imag: 0.0 }
      responses:
        "202":
          description: Task accepted and queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitResponse"
        "400":
          $ref: "#/components/responses/ClientError"
        "402":
          description: Insufficient Redis client balance (`WQC_CLIENT_BILLING`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/task/{task_id}:
    get:
      tags: [Tasks]
      summary: Task status, progress, and result URLs
      description: |
        Unknown ids return `404` with `{"error":"task not found: …"}`.

        In-progress statuses: `pending`, `dispatched`, `finalizing`.
        While `finalizing`, `phase` is one of `waiting_pcs`,
        `composing_proofs`, `sealing_manifest`. Keep polling until
        `completed` or `failed`.
      operationId: getTask
      parameters:
        - $ref: "#/components/parameters/TaskIdPath"
      responses:
        "200":
          description: Current task view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskView"
              examples:
                in_progress:
                  value:
                    task_id: "0192abc-def"
                    status: dispatched
                    progress:
                      progress_percent: 45.5
                      detail:
                        completed_slices: 455
                        total_slices: 1000
                completed:
                  value:
                    task_id: "0192abc-def"
                    status: completed
                    root_hash: "sha3-256…"
                    manifest_url: "https://s3.example.com/wqc/manifests/0192abc-def.json?X-Amz-Signature=1a2b3c"
                failed:
                  value:
                    task_id: "0192abc-def"
                    status: failed
                    error: "node consensus timeout"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          $ref: "#/components/responses/InternalErrorJSON"

  /api/v1/p2p/bootstrap:
    get:
      tags: [Bootstrap]
      summary: libp2p bootstrap multiaddrs and orchestrator pubkey
      description: |
        Used by worker nodes at startup. Set `WQC_BOOTSTRAP_URLS` to this
        full URL. When the libp2p host listens on `0.0.0.0`, set
        `WQC_P2P_ADVERTISE_ADDRS` (comma-separated multiaddrs **without**
        `/p2p/…`; the handler appends the peer id).
      operationId: getP2PBootstrap
      responses:
        "200":
          description: Dialable addresses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/P2PBootstrapResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          description: No dialable multiaddrs configured
          content:
            text/plain:
              schema:
                type: string

  /api/v1/economy/base-fee:
    get:
      tags: [Economy]
      summary: Current dynamic BaseFee and gas coefficients
      operationId: getEconomyBaseFee
      responses:
        "200":
          description: BaseFee snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EconomyBaseFeeResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /api/v1/economy/quote:
    post:
      tags: [Economy]
      summary: Estimate client escrow without locking funds
      description: |
        `gate_count` of `0` is treated as `1`. Unknown `security_level`
        is coerced to `normal`.
      operationId: postEconomyQuote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EconomyQuoteRequest"
      responses:
        "200":
          description: Escrow estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EconomyQuoteResponse"
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /api/v1/economy/burn-total:
    get:
      tags: [Economy]
      summary: Cumulative burn (pWQC)
      operationId: getEconomyBurnTotal
      responses:
        "200":
          description: Burn totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EconomyBurnResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/economy/client/{client_id}:
    get:
      tags: [Economy]
      summary: Client pWQC balance
      operationId: getEconomyClientBalance
      parameters:
        - name: client_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Client balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EconomyClientBalanceResponse"
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/economy/node/{operator_id}:
    get:
      tags: [Economy]
      summary: Operator pWQC balance
      description: Legacy path name (`/node/`); the id is an **operator_id**.
      operationId: getEconomyNodeBalance
      parameters:
        - $ref: "#/components/parameters/OperatorIdPath"
      responses:
        "200":
          description: Operator balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EconomyOperatorBalanceResponse"
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/economy/payout/register:
    post:
      tags: [Payout]
      summary: Create or rotate an operator payout binding
      description: |
        Signed with the Ed25519 operator key used for bids (`wqc-payout-v1`
        domain). `payout_address` must be lowercase `0x` + 40 hex after
        normalization. `nonce` must strictly increase per
        `(operator_id, chain_id)`.
      operationId: postEconomyPayoutRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayoutMutationRequest"
      responses:
        "200":
          description: Binding stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutBindingResponse"
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Nonce must increase
          content:
            text/plain:
              schema:
                type: string
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/economy/payout/revoke:
    post:
      tags: [Payout]
      summary: Revoke the active payout binding
      operationId: postEconomyPayoutRevoke
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayoutMutationRequest"
      responses:
        "200":
          description: Binding revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutBindingResponse"
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Nonce must increase
          content:
            text/plain:
              schema:
                type: string
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/economy/payout/{operator_id}:
    get:
      tags: [Payout]
      summary: Read the active payout binding (public)
      operationId: getEconomyPayout
      parameters:
        - $ref: "#/components/parameters/OperatorIdPath"
        - name: chain_id
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          description: EIP-155 chain id (positive decimal)
      responses:
        "200":
          description: Active binding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutBindingResponse"
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "404":
          description: No active payout binding
          content:
            text/plain:
              schema:
                type: string
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/economy/escrow/lock/preflight:
    post:
      tags: [Settlement]
      summary: Check ERC-20 balance/allowance for lockEscrow
      description: |
        Requires L2 read env (`WQC_SETTLE_*`). Does not broadcast.
        When `needs_approve` is true, `check.approve_to` is the token and
        `check.approve_calldata` is `approve(settlement, required)`.
        The orchestrator never submits `approve` for the client.
      operationId: postLockEscrowPreflight
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LockEscrowRequest"
      responses:
        "200":
          description: Approve check plus lock plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockEscrowPreflightResponse"
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "404":
          $ref: "#/components/responses/PlainNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/economy/escrow/lock/build:
    post:
      tags: [Settlement]
      summary: Build SettlementCommit.lockEscrow calldata (no broadcast)
      operationId: postLockEscrowBuild
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LockEscrowRequest"
      responses:
        "200":
          description: Prepared lock transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockEscrowBuildResponse"
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "404":
          $ref: "#/components/responses/PlainNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/economy/escrow/lock/submit:
    post:
      tags: [Settlement]
      summary: Broadcast lockEscrow via the relayer hot wallet
      description: |
        Body may include `permit` to skip on-chain approve
        (`lockEscrowWithPermit`). Idempotent if `lock_escrow_tx_hash` is
        already stored. Optional `X-Settle-Submit-Token` /
        `Authorization: Bearer` when `WQC_SETTLE_SUBMIT_TOKEN` is set.
      operationId: postLockEscrowSubmit
      parameters:
        - $ref: "#/components/parameters/SettleSubmitToken"
        - $ref: "#/components/parameters/AuthorizationBearer"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LockEscrowRequest"
      responses:
        "200":
          description: Broadcast result (or prior hash if already submitted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockEscrowSubmitResponse"
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/PlainNotFound"
        "409":
          description: Insufficient balance or allowance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockEscrowSubmitResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/economy/settle/build:
    post:
      tags: [Settlement]
      summary: Build SettlementCommit.settle calldata (no broadcast)
      description: |
        Requires a published economics receipt (`receipt_hash` on task meta)
        and an active payout binding for every rewarded operator on
        `chain_id`. Does **not** call `lockEscrow`; status must already be
        `EscrowLocked`.
      operationId: postSettleBuild
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettleRequest"
      responses:
        "200":
          description: Prepared settle transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettleBuildResponse"
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "404":
          $ref: "#/components/responses/PlainNotFound"
        "409":
          description: Not ready, no receipt, or missing operator payouts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettleBuildResponse"
            text/plain:
              schema:
                type: string
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/economy/settle/submit:
    post:
      tags: [Settlement]
      summary: Broadcast settle() via the relayer hot wallet
      description: |
        Same body as `/settle/build`. Idempotent if `settle_tx_hash` is
        already on task meta. Prerequisite: on-chain `lockEscrow` for the
        task (`EscrowLocked`).
      operationId: postSettleSubmit
      parameters:
        - $ref: "#/components/parameters/SettleSubmitToken"
        - $ref: "#/components/parameters/AuthorizationBearer"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettleRequest"
      responses:
        "200":
          description: Broadcast result (or prior hash if already submitted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettleSubmitResponse"
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/PlainNotFound"
        "409":
          description: Not ready, no receipt, or missing payouts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettleSubmitResponse"
            text/plain:
              schema:
                type: string
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/economy/settle/finalize/preflight:
    post:
      tags: [Settlement]
      summary: Check on-chain status/deadline before finalize()
      description: |
        Reads `tasks(taskId)` status and deadline vs latest block time.
        `check` includes `ready`, `window_open`, `bad_status`,
        `already_finalized`.
      operationId: postFinalizePreflight
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeRequest"
      responses:
        "200":
          description: Readiness snapshot plus finalize plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizePreflightResponse"
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "404":
          $ref: "#/components/responses/PlainNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/economy/settle/finalize/build:
    post:
      tags: [Settlement]
      summary: Build SettlementCommit.finalize calldata (no broadcast)
      operationId: postFinalizeBuild
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeRequest"
      responses:
        "200":
          description: Prepared finalize transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizeBuildResponse"
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "404":
          $ref: "#/components/responses/PlainNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/economy/settle/finalize/submit:
    post:
      tags: [Settlement]
      summary: Broadcast finalize() via the relayer hot wallet
      description: |
        Same auth as settle/submit. Returns `409` while the challenge
        window is open or on-chain status is wrong. Stores
        `finalize_tx_hash`.
      operationId: postFinalizeSubmit
      parameters:
        - $ref: "#/components/parameters/SettleSubmitToken"
        - $ref: "#/components/parameters/AuthorizationBearer"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeRequest"
      responses:
        "200":
          description: Broadcast result (or prior hash if already submitted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizeSubmitResponse"
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/PlainNotFound"
        "409":
          description: Window still open, bad status, or already finalized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizeSubmitResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  parameters:
    TaskIdPath:
      name: task_id
      in: path
      required: true
      schema:
        type: string
      description: UUID v7 assigned at submit
    OperatorIdPath:
      name: operator_id
      in: path
      required: true
      schema:
        type: string
      description: sha256 of the operator Ed25519 public key (hex)
    SettleSubmitToken:
      name: X-Settle-Submit-Token
      in: header
      required: false
      schema:
        type: string
      description: Required when `WQC_SETTLE_SUBMIT_TOKEN` is set (alternative to Bearer)
    AuthorizationBearer:
      name: Authorization
      in: header
      required: false
      schema:
        type: string
      description: "`Bearer <token>` alternative to `X-Settle-Submit-Token`"

  responses:
    MethodNotAllowed:
      description: Method not allowed
      content:
        text/plain:
          schema:
            type: string
    PlainBadRequest:
      description: Invalid path, query, or JSON body (text/plain)
      content:
        text/plain:
          schema:
            type: string
    PlainNotFound:
      description: Task not found (text/plain)
      content:
        text/plain:
          schema:
            type: string
    Unauthorized:
      description: Bad signature or missing settle-submit token
      content:
        text/plain:
          schema:
            type: string
    ServiceUnavailable:
      description: Feature disabled or dependency missing
      content:
        text/plain:
          schema:
            type: string
    ClientError:
      description: Invalid argument (JSON on submit domain errors; sometimes text/plain)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
        text/plain:
          schema:
            type: string
    InternalError:
      description: Internal error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
        text/plain:
          schema:
            type: string
    InternalErrorJSON:
      description: Internal error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"

  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: string

    SecurityLevel:
      type: string
      enum: [low, normal, high, ultra]
      description: Selects FRI query count / required votes

    OutputMode:
      type: string
      enum: [statevector_scalar, sample_counts, expectation]
      default: statevector_scalar
      description: |
        `statevector_scalar` — amplitude at |0…0⟩.
        `sample_counts` — shot histogram under an orchestrator-issued seed.
        `expectation` — Pauli sums; forbids MEASURE gates.

        `sample_counts` caps classical bits at 16, and mid-circuit or
        post-slice compact width at 20 qubits. Large sliced workloads use
        `statevector_scalar`.

        Measurement basis, `counts` key order, and what the STARK binds in
        each mode: see
        [circuit-payload.md](https://github.com/world-qc/wqc-docs/blob/main/spec/circuit-payload.md).

    CircuitGate:
      type: object
      required: [type]
      properties:
        type:
          type: string
          description: |
            Gate name. Standard set includes H, X, Y, Z, S, T, CNOT, CZ,
            CCNOT, RX, RY, RZ, MEASURE, RESET, IF.
        params:
          description: |
            Single-parameter gates accept a bare integer or a one-element
            array. Multi-qubit gates use an integer array. MEASURE uses
            `{qubit, cbit}`. IF uses `{cbit, value, gate}`. RX/RY/RZ use
            `[qubit, theta]`.

            Note that core `/compute` accepts only the bare form; see
            [circuit-payload.md §1.1](https://github.com/world-qc/wqc-docs/blob/main/spec/circuit-payload.md#11-two-params-dialects).

    NoiseModel:
      type: object
      description: |
        Optional trajectory-sampling noise. **Not STARK-bound** — see
        [circuit-payload.md §6](https://github.com/world-qc/wqc-docs/blob/main/spec/circuit-payload.md#6-optional-noise-model).
      properties:
        depolarizing_p:
          type: number
          minimum: 0
          maximum: 1
        readout_error:
          type: number
          minimum: 0
          maximum: 1

    ComplexCoeff:
      type: object
      required: [real, imag]
      properties:
        real:
          type: number
        imag:
          type: number

    PauliTerm:
      type: object
      required: [label, coeff]
      properties:
        label:
          type: string
          description: |
            Pauli string over `I`, `X`, `Y`, `Z`; length must equal
            `qubit_count`. Rightmost character applies to qubit 0 (same
            Qiskit order as `counts` keys).
        coeff:
          $ref: "#/components/schemas/ComplexCoeff"

    ObservableSpec:
      type: object
      required: [id, terms]
      properties:
        id:
          type: string
        terms:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PauliTerm"

    ERC2612Permit:
      type: object
      required: [deadline, v, r, s]
      description: |
        Off-chain EIP-2612 signature. `value` in the signed message must
        equal the lock amount; `spender` must be the settlement contract.
      properties:
        deadline:
          type: integer
          format: int64
        v:
          type: integer
          enum: [27, 28]
        r:
          type: string
          description: "0x + 64 hex"
        s:
          type: string
          description: "0x + 64 hex"

    SubmitRequest:
      type: object
      required: [qubit_count, circuit, security_level]
      properties:
        qubit_count:
          type: integer
          minimum: 1
        classical_bit_count:
          type: integer
          minimum: 1
          description: Required for `sample_counts`
        circuit:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CircuitGate"
        security_level:
          $ref: "#/components/schemas/SecurityLevel"
        output_mode:
          $ref: "#/components/schemas/OutputMode"
        shots:
          type: integer
          format: int64
          minimum: 1
          description: Required for `sample_counts`
        client_id:
          type: string
          description: Required when client billing is enabled
        sample_seed:
          type: integer
          format: int64
          description: Ignored; orchestrator overwrites for sample_counts
        noise_model:
          $ref: "#/components/schemas/NoiseModel"
        observables:
          type: array
          items:
            $ref: "#/components/schemas/ObservableSpec"
          description: Required for `expectation`
        client_address:
          type: string
          description: EVM address for submit-time lockEscrowWithPermit
        chain_id:
          type: integer
          format: int64
        permit:
          $ref: "#/components/schemas/ERC2612Permit"

    SubmitResponse:
      type: object
      required: [task_id, status]
      properties:
        task_id:
          type: string
        status:
          type: string
          enum: [accepted]
          description: HTTP accept flag; task meta starts as `pending`
        client_id:
          type: string
        escrow_pwqc:
          type: string
          description: Locked escrow as a decimal integer string (pWQC)
        base_fee_swqc:
          type: string
        estimated_slices:
          type: integer
          format: int64
        lock_escrow_tx_hash:
          type: string
        lock_escrow_chain_id:
          type: integer
          format: int64

    TaskStatus:
      type: string
      enum: [pending, dispatched, finalizing, completed, failed]

    FinalizingPhase:
      type: string
      enum: [waiting_pcs, composing_proofs, sealing_manifest]

    TaskProgress:
      type: object
      properties:
        progress_percent:
          type: number
        detail:
          type: object
          properties:
            completed_slices:
              type: integer
              format: int64
            total_slices:
              type: integer

    TaskView:
      type: object
      required: [task_id, status]
      properties:
        task_id:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        phase:
          $ref: "#/components/schemas/FinalizingPhase"
        progress:
          $ref: "#/components/schemas/TaskProgress"
        root_hash:
          type: string
        manifest_url:
          type: string
          format: uri
          description: Presigned GET for the result manifest
        receipt_hash:
          type: string
        receipt_url:
          type: string
          format: uri
        proof_root_hash:
          type: string
        root_proof_url:
          type: string
          format: uri
        error:
          type: string
          description: Present when `status` is `failed`

    P2PBootstrapResponse:
      type: object
      required: [peer_id, public_key_b64, multiaddrs]
      properties:
        peer_id:
          type: string
        public_key_b64:
          type: string
          description: Orchestrator Ed25519 public key (base64)
        multiaddrs:
          type: array
          items:
            type: string
          example:
            - /ip4/10.20.3.11/tcp/4001/p2p/12D3KooW...
            - /ip4/10.20.3.11/udp/4001/quic-v1/p2p/12D3KooW...

    EconomyBaseFeeResponse:
      type: object
      required: [base_fee_swqc, base_fee_wqc, gas_alpha, gas_beta, gas_gamma]
      properties:
        base_fee_swqc:
          type: string
        base_fee_wqc:
          type: string
        base_fee_min_swqc:
          type: string
        base_fee_max_swqc:
          type: string
        target_queue_depth:
          type: integer
          format: int64
        gas_alpha:
          type: integer
          format: int64
        gas_beta:
          type: integer
          format: int64
        gas_gamma:
          type: integer
          format: int64

    EconomyQuoteRequest:
      type: object
      required: [qubit_count]
      properties:
        qubit_count:
          type: integer
          minimum: 1
        gate_count:
          type: integer
          minimum: 0
          description: Treated as 1 when 0 or omitted
        security_level:
          type: string
          description: Invalid values are coerced to `normal`

    EconomyQuoteResponse:
      type: object
      required: [base_fee_swqc, escrow_pwqc, escrow_wqc, estimated_slices, per_slice_pwqc]
      properties:
        base_fee_swqc:
          type: string
        escrow_pwqc:
          type: string
        escrow_wqc:
          type: string
        estimated_slices:
          type: integer
          format: int64
        per_slice_pwqc:
          type: string

    EconomyBurnResponse:
      type: object
      required: [burn_total_pwqc, burn_total_wqc]
      properties:
        burn_total_pwqc:
          type: string
        burn_total_wqc:
          type: string

    EconomyClientBalanceResponse:
      type: object
      required: [client_id, balance_pwqc, balance_wqc]
      properties:
        client_id:
          type: string
        balance_pwqc:
          type: string
        balance_wqc:
          type: string

    EconomyOperatorBalanceResponse:
      type: object
      required: [operator_id, balance_pwqc, balance_wqc]
      properties:
        operator_id:
          type: string
        node_id:
          type: string
          description: Duplicate of `operator_id` (legacy field name)
        balance_pwqc:
          type: string
        balance_wqc:
          type: string

    PayoutMutationRequest:
      type: object
      required:
        - operator_id
        - operator_pubkey_b64
        - payout_address
        - chain_id
        - nonce
        - signature_b64
      properties:
        operator_id:
          type: string
        operator_pubkey_b64:
          type: string
        payout_address:
          type: string
          description: "0x + 40 hex (normalized to lowercase)"
        chain_id:
          type: integer
          format: int64
        nonce:
          type: integer
          format: int64
        signature_b64:
          type: string

    PayoutBindingResponse:
      type: object
      required: [operator_id, chain_id, payout_address, nonce, status, updated_at]
      properties:
        operator_id:
          type: string
        chain_id:
          type: integer
          format: int64
        payout_address:
          type: string
        nonce:
          type: integer
          format: int64
        status:
          type: string
          enum: [active, revoked]
        updated_at:
          type: integer
          format: int64
          description: Unix timestamp

    SettleRequest:
      type: object
      required: [task_id, client_address]
      properties:
        task_id:
          type: string
        client_address:
          type: string
        chain_id:
          type: integer
          format: int64

    LockEscrowRequest:
      allOf:
        - $ref: "#/components/schemas/SettleRequest"
        - type: object
          properties:
            permit:
              $ref: "#/components/schemas/ERC2612Permit"

    SettlePayout:
      type: object
      properties:
        to:
          type: string
        amount_pwqc:
          type: string

    SettlePlan:
      type: object
      properties:
        task_id:
          type: string
        task_id_bytes32:
          type: string
        root_hash_bytes32:
          type: string
        receipt_hash_bytes32:
          type: string
        payouts_hash:
          type: string
        client_address:
          type: string
        burn_amount_pwqc:
          type: string
        refund_amount_pwqc:
          type: string
        payouts:
          type: array
          items:
            $ref: "#/components/schemas/SettlePayout"
        calldata:
          type: string
        missing_operators:
          type: array
          items:
            type: string
        chain_id:
          type: integer
          format: int64

    SettleBuildResponse:
      type: object
      properties:
        plan:
          $ref: "#/components/schemas/SettlePlan"
        settlement_contract:
          type: string
        missing_operators:
          type: array
          items:
            type: string

    SettleSubmitResult:
      type: object
      properties:
        task_id:
          type: string
        chain_id:
          type: integer
          format: int64
        tx_hash:
          type: string
        settlement_contract:
          type: string
        already_submitted:
          type: boolean
        plan:
          $ref: "#/components/schemas/SettlePlan"

    SettleSubmitResponse:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/SettleSubmitResult"

    LockPlan:
      type: object
      properties:
        task_id:
          type: string
        task_id_bytes32:
          type: string
        client_address:
          type: string
        amount_pwqc:
          type: string
        calldata:
          type: string
        chain_id:
          type: integer
          format: int64
        with_permit:
          type: boolean
        permit:
          $ref: "#/components/schemas/ERC2612Permit"

    ApproveCheck:
      type: object
      properties:
        task_id:
          type: string
        chain_id:
          type: integer
          format: int64
        client_address:
          type: string
        settlement_contract:
          type: string
        token_address:
          type: string
        required_pwqc:
          type: string
        balance_pwqc:
          type: string
        allowance_pwqc:
          type: string
        ready:
          type: boolean
        needs_approve:
          type: boolean
        insufficient_balance:
          type: boolean
        approve_to:
          type: string
        approve_calldata:
          type: string
        approve_amount_pwqc:
          type: string

    LockEscrowPreflightResponse:
      type: object
      properties:
        check:
          $ref: "#/components/schemas/ApproveCheck"
        plan:
          $ref: "#/components/schemas/LockPlan"
        settlement_contract:
          type: string

    LockEscrowBuildResponse:
      type: object
      properties:
        plan:
          $ref: "#/components/schemas/LockPlan"
        settlement_contract:
          type: string

    LockSubmitResult:
      type: object
      properties:
        task_id:
          type: string
        chain_id:
          type: integer
          format: int64
        tx_hash:
          type: string
        settlement_contract:
          type: string
        already_submitted:
          type: boolean
        plan:
          $ref: "#/components/schemas/LockPlan"
        check:
          $ref: "#/components/schemas/ApproveCheck"

    LockEscrowSubmitResponse:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/LockSubmitResult"
        check:
          $ref: "#/components/schemas/ApproveCheck"
        error:
          type: string

    FinalizeRequest:
      type: object
      required: [task_id]
      properties:
        task_id:
          type: string
        chain_id:
          type: integer
          format: int64

    FinalizePlan:
      type: object
      properties:
        task_id:
          type: string
        task_id_bytes32:
          type: string
        calldata:
          type: string
        chain_id:
          type: integer
          format: int64

    FinalizeCheck:
      type: object
      properties:
        task_id:
          type: string
        chain_id:
          type: integer
          format: int64
        status:
          type: integer
        status_name:
          type: string
        deadline_unix:
          type: integer
          format: int64
        block_timestamp:
          type: integer
          format: int64
        ready:
          type: boolean
        window_open:
          type: boolean
        bad_status:
          type: boolean
        already_finalized:
          type: boolean

    FinalizePreflightResponse:
      type: object
      properties:
        check:
          $ref: "#/components/schemas/FinalizeCheck"
        plan:
          $ref: "#/components/schemas/FinalizePlan"
        settlement_contract:
          type: string

    FinalizeBuildResponse:
      type: object
      properties:
        plan:
          $ref: "#/components/schemas/FinalizePlan"
        settlement_contract:
          type: string

    FinalizeSubmitResult:
      type: object
      properties:
        task_id:
          type: string
        chain_id:
          type: integer
          format: int64
        tx_hash:
          type: string
        settlement_contract:
          type: string
        already_submitted:
          type: boolean
        plan:
          $ref: "#/components/schemas/FinalizePlan"
        check:
          $ref: "#/components/schemas/FinalizeCheck"

    FinalizeSubmitResponse:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/FinalizeSubmitResult"
        check:
          $ref: "#/components/schemas/FinalizeCheck"
        error:
          type: string
