name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'openapi/**'
      - 'redocly.yaml'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'openapi/**'
      - 'redocly.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  REDOCLY: '@redocly/cli@2.49.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Publishing a malformed description would produce a broken page rather than a
      # failed build, so validate before rendering anything.
      - name: Validate OpenAPI descriptions
        run: npx --yes ${{ env.REDOCLY }} lint openapi/orchestrator.yaml openapi/core.yaml

      # Rendered pages are self-contained: no CDN fetch and no telemetry from readers'
      # browsers, and the site keeps working if the Redocly CDN does not.
      - name: Render API reference
        run: |
          npx --yes ${{ env.REDOCLY }} build-docs openapi/orchestrator.yaml \
            --template site/_template.hbs \
            --title 'Orchestrator Client API — WQC Protocol' \
            -o _site/orchestrator/index.html
          npx --yes ${{ env.REDOCLY }} build-docs openapi/core.yaml \
            --template site/_template.hbs \
            --title 'Core Engine API — WQC Protocol' \
            -o _site/core/index.html

      - name: Assemble site
        run: |
          cp site/index.html _site/
          mkdir -p _site/openapi
          cp openapi/orchestrator.yaml openapi/core.yaml openapi/sources.json _site/openapi/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    # Pull requests validate and render; only main publishes.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages must already be enabled with "GitHub Actions" as the source. The workflow
      # token cannot create the site itself, so enabling it is a one-time manual step in
      # repository settings.
      - id: deployment
        uses: actions/deploy-pages@v5
